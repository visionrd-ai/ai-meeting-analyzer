<!DOCTYPE html>
<html>
<head>
    <title>Debug Recording Button</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-info { background: #f0f0f0; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e9; color: #2e7d32; }
        .warning { background: #fff3e0; color: #ef6c00; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px 5px; }
    </style>
</head>
<body>
    <h1>🎯 Perfect AI Recording Debug</h1>
    
    <div class="debug-info">
        <h3>Current Status:</h3>
        <div id="status">Checking...</div>
    </div>
    
    <div class="debug-info">
        <h3>Microphone Status:</h3>
        <div id="mic-status">Checking...</div>
    </div>
    
    <div class="debug-info">
        <h3>Server Connection:</h3>
        <div id="server-status">Checking...</div>
    </div>
    
    <button onclick="testRecording()">🎯 Test Start Recording</button>
    <button onclick="checkStatus()">🔍 Check Status</button>
    <button onclick="testMicrophone()">🎤 Test Microphone</button>
    
    <div id="log" class="debug-info">
        <h3>Debug Log:</h3>
        <div id="log-content"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logContent = document.getElementById('log-content');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            logContent.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logContent.scrollTop = logContent.scrollHeight;
        }

        async function checkStatus() {
            log('Checking server status...');
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                document.getElementById('status').innerHTML = `
                    <strong>Recording:</strong> ${data.is_recording ? 'Yes' : 'No'}<br>
                    <strong>Analyzing:</strong> ${data.is_analyzing ? 'Yes' : 'No'}<br>
                    <strong>Audio Source:</strong> ${data.audio_source}<br>
                    <strong>Session ID:</strong> ${data.session_id || 'None'}
                `;
                log('Status check successful', 'success');
            } catch (error) {
                log('Status check failed: ' + error.message, 'error');
                document.getElementById('status').innerHTML = 'Error: ' + error.message;
            }
        }

        async function testMicrophone() {
            log('Testing microphone access...');
            
            // Check if HTTPS
            if (window.location.protocol !== 'https:') {
                log('WARNING: Not using HTTPS - microphone may not work', 'warning');
                document.getElementById('mic-status').innerHTML = 'ERROR: HTTPS required for microphone access';
                return;
            }

            // Check if mediaDevices is available
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                log('ERROR: MediaDevices API not available', 'error');
                document.getElementById('mic-status').innerHTML = 'ERROR: Browser does not support microphone access';
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                document.getElementById('mic-status').innerHTML = 'SUCCESS: Microphone access granted';
                log('Microphone test successful', 'success');
            } catch (error) {
                log('Microphone test failed: ' + error.message, 'error');
                document.getElementById('mic-status').innerHTML = 'ERROR: ' + error.message;
            }
        }

        async function testRecording() {
            log('Testing recording start...');
            
            try {
                // First check microphone
                await testMicrophone();
                
                // Then try to start recording
                const response = await fetch('/start_recording', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        mode: 'automatic',
                        words_threshold: 200,
                        audio_source: 'mic',
                        transcription_engine: 'faster_whisper',
                        voice_isolation_level: 'maximum',
                        noise_cancellation_strength: 'aggressive'
                    })
                });

                log(`Response status: ${response.status}`);
                
                const contentType = response.headers.get('content-type');
                log(`Response content-type: ${contentType}`);

                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    log('Non-JSON response received: ' + text.substring(0, 200), 'error');
                    return;
                }

                const result = await response.json();
                log(`Response data: ${JSON.stringify(result, null, 2)}`);

                if (result.success) {
                    log('Recording started successfully!', 'success');
                    document.getElementById('server-status').innerHTML = 'SUCCESS: Recording started';
                } else {
                    log('Recording failed: ' + (result.error || result.message), 'error');
                    document.getElementById('server-status').innerHTML = 'ERROR: ' + (result.error || result.message);
                }

            } catch (error) {
                log('Recording test failed: ' + error.message, 'error');
                document.getElementById('server-status').innerHTML = 'ERROR: ' + error.message;
            }
        }

        // Auto-check status on load
        window.onload = function() {
            log('Debug page loaded');
            checkStatus();
            
            // Check HTTPS
            if (window.location.protocol === 'https:') {
                log('HTTPS detected - good for microphone access', 'success');
            } else {
                log('HTTP detected - microphone may not work', 'warning');
            }
        };
    </script>
</body>
</html>
